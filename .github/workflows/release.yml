name: Release cutris
run-name: Release cutris ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, without v (for example 1.0.0)'
        type: string
        required: true
        default: '1.0.0'
      release_notes:
        description: 'Release notes: separate each bullet with a semicolon'
        type: string
        required: true

permissions: {}

concurrency:
  group: cutris-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate release request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const expectedRef = `refs/heads/${context.payload.repository.default_branch}`;
            if (context.ref !== expectedRef) throw new Error('Run releases from the default branch.');
            const version = context.payload.inputs.version;
            if (!/^(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$/.test(version)
                || version.split('.').some(part => Number(part) > 65535)) {
              throw new Error('Version must be three numbers from 0 to 65535, such as 1.0.0 (without v).');
            }
            const notes = context.payload.inputs.release_notes;
            if (!notes || notes.length > 20000 || !notes.split(';').some(note => note.trim())) {
              throw new Error('Enter release notes, separated with semicolons (maximum 20,000 characters).');
            }
            const tag = `v${version}`;
            try {
              await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
              throw new Error(`Tag ${tag} already exists. Existing versions are never overwritten.`);
            } catch (error) { if (error.status !== 404) throw error; }
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            if (releases.some(release => release.tag_name === tag)) {
              throw new Error(`Release ${tag} already exists. Inspect any failed draft before retrying.`);
            }

      - name: Check out requested source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Prepare version and release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: python scripts/prepare_release.py

      - name: Install build and test dependencies
        run: python -m pip install -r requirements-release.txt

      - name: Run regression tests
        run: python -m pytest -q

      - name: Install verified Inno Setup compiler
        run: ./scripts/install_inno.ps1

      - name: Build installer, portable app and source archive
        run: python scripts/build.py --installer

      - name: Verify complete release and source version
        run: python scripts/prepare_release.py --finalize

      - name: Preserve verified release artifacts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cutris-windows-release
          path: |
            release/
            build/release-control/release.json
            build/release-control/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # This job never checks out or executes project code. Artifacts are data only.
      - name: Download verified build from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-input
          merge-multiple: true

      - name: Upload all assets, then publish
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs/promises');
            const crypto = require('node:crypto');
            const path = require('node:path');
            const sourceSha = context.sha;
            if (context.ref !== `refs/heads/${context.payload.repository.default_branch}`) {
              throw new Error('Releases must come from the default branch.');
            }
            const metadata = JSON.parse(await fs.readFile('release-input/build/release-control/release.json', 'utf8'));
            const version = context.payload.inputs.version;
            if (!/^(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$/.test(version)
                || version.split('.').some(part => Number(part) > 65535)) throw new Error('Invalid version.');
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const tag = `v${version}`;
            if (metadata.version !== version || metadata.tag !== tag
                || metadata.source_sha !== sourceSha || metadata.repository !== repository) {
              throw new Error('Release metadata does not match this workflow request.');
            }
            const brandingResult = await github.rest.repos.getContent({...context.repo, path: 'branding.json', ref: sourceSha});
            const originalText = Buffer.from(brandingResult.data.content, 'base64').toString('utf8');
            const branding = JSON.parse(originalText);
            if (!/^[a-z][a-z0-9-]{0,49}$/.test(branding.executable_name)) throw new Error('Invalid executable name.');
            branding.version = version;
            const brandingText = JSON.stringify(branding, null, 2) + '\n';
            if (brandingText !== metadata.branding_text || metadata.executable !== branding.executable_name
                || metadata.display_name !== branding.display_name) throw new Error('Unexpected branding changes.');
            const prefix = `${branding.executable_name}-${version}`;
            const names = [`${prefix}-windows-x64-setup.exe`, `${prefix}-windows-x64-portable.zip`,
                           `${prefix}-source.zip`, 'SHA256SUMS.txt'];
            if (JSON.stringify(metadata.assets) !== JSON.stringify(names)) throw new Error('Unexpected release assets.');
            const directory = path.resolve('release-input/release');
            const actualNames = (await fs.readdir(directory)).sort();
            if (JSON.stringify(actualNames) !== JSON.stringify([...names].sort())) throw new Error('Unexpected files in release.');
            const checksums = {};
            for (const name of names) {
              const filename = path.join(directory, name);
              const stats = await fs.lstat(filename);
              if (!stats.isFile() || stats.size === 0) throw new Error(`Invalid release asset: ${name}`);
              const bytes = await fs.readFile(filename);
              checksums[name] = crypto.createHash('sha256').update(bytes).digest('hex');
              if (checksums[name] !== metadata.sha256[name]) throw new Error(`Checksum mismatch: ${name}`);
            }
            const sums = (await fs.readFile(path.join(directory, 'SHA256SUMS.txt'), 'utf8')).trim().split(/\r?\n/).sort();
            const expectedSums = names.slice(0, -1).map(name => `${checksums[name]}  ${name}`).sort();
            if (JSON.stringify(sums) !== JSON.stringify(expectedSums)) throw new Error('Checksum manifest mismatch.');
            if (typeof metadata.body !== 'string' || !metadata.body.startsWith("## What's new\n\n- ")
                || metadata.body.length > 100000) throw new Error('Invalid release notes.');

            async function requireUnusedVersion() {
              try {
                await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
                throw new Error(`Tag ${tag} already exists. Existing versions are never overwritten.`);
              } catch (error) { if (error.status !== 404) throw error; }
              const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
              if (releases.some(release => release.tag_name === tag)) {
                throw new Error(`Release ${tag} already exists. Delete only an unpublished failed draft before retrying.`);
              }
            }
            await requireUnusedVersion();
            let targetSha = sourceSha;
            if (brandingText !== originalText) {
              const parent = await github.rest.git.getCommit({...context.repo, commit_sha: sourceSha});
              const tree = await github.rest.git.createTree({...context.repo, base_tree: parent.data.tree.sha,
                tree: [{path: 'branding.json', mode: '100644', type: 'blob', content: brandingText}]});
              const identity = {name: 'cutris release bot', email: 'release@cutris.invalid'};
              const commit = await github.rest.git.createCommit({...context.repo,
                message: `Release ${branding.display_name} ${version}`, tree: tree.data.sha,
                parents: [sourceSha], author: identity, committer: identity});
              targetSha = commit.data.sha;
            }
            // Recheck immediately before mutation. The default branch is never changed.
            await requireUnusedVersion();
            const marker = `<!-- cutris-release source=${sourceSha} run=${context.runId} -->`;
            const created = await github.rest.repos.createRelease({...context.repo, tag_name: tag,
              target_commitish: targetSha, name: `${branding.display_name} ${version}`,
              body: metadata.body + '\n' + marker, draft: true, prerelease: false});
            const releaseId = created.data.id;
            core.info(`Created draft release ${releaseId}. Uploading all four verified assets.`);
            try {
              for (const name of names) {
                const bytes = await fs.readFile(path.join(directory, name));
                await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: releaseId, name,
                  headers: {'content-type': name.endsWith('.zip') ? 'application/zip' : 'application/octet-stream',
                            'content-length': bytes.length}, data: bytes});
              }
              const uploaded = await github.paginate(github.rest.repos.listReleaseAssets,
                {...context.repo, release_id: releaseId, per_page: 100});
              if (uploaded.length !== names.length || !names.every(name => uploaded.some(asset =>
                  asset.name === name && asset.state === 'uploaded'
                  && asset.digest === `sha256:${checksums[name]}`))) throw new Error('Uploaded assets did not verify.');
              // GitHub creates the version tag when the draft is published, pointing at targetSha.
              const published = await github.rest.repos.updateRelease({...context.repo, release_id: releaseId,
                draft: false, make_latest: 'true'});
              await core.summary.addHeading(`${branding.display_name} ${version} published`)
                .addLink('Open release and downloads', published.data.html_url).write();
              core.setOutput('release_url', published.data.html_url);
            } catch (error) {
              core.error(`Release failed. Inspect draft ${releaseId} under Releases. ` +
                'Delete only this unpublished draft before rerunning; never delete a published version.');
              throw error;
            }
